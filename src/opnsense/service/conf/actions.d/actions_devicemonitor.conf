[scan]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/DeviceMonitor/scan_network.py
parameters:
type:script_output
message:Running network scan

[start]
command:/usr/local/etc/rc.d/devicemonitor start || true
parameters:
type:script
message:Starting Device Monitor daemon

[stop]
command:/usr/local/etc/rc.d/devicemonitor stop || true
parameters:
type:script
message:Stopping Device Monitor daemon

[restart]
command:/usr/local/etc/rc.d/devicemonitor restart || true
parameters:
type:script
message:Restarting Device Monitor daemon

[configure]
command:/bin/chmod 600 /var/db/devicemonitor/config.json 2>/dev/null; /usr/local/etc/rc.d/devicemonitor restart || true
parameters:
type:script
message:Applying Device Monitor configuration
description:Tightens the rendered configuration and restarts the daemon

[status]
command:/bin/sh /usr/local/opnsense/scripts/OPNsense/DeviceMonitor/daemon_status.sh
parameters:
type:script_output
message:Getting Device Monitor daemon status

[sendEmailNotification]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/DeviceMonitor/notify_email.php
parameters:
type:script_output
message:Send email notification for new devices
description:Reads devices from database with notification_pending flag

[sendWebhookNotification]
command:/usr/local/bin/php /usr/local/opnsense/scripts/OPNsense/DeviceMonitor/notify_webhook.php
parameters:
type:script_output
message:Send webhook notification for new devices
description:Reads devices from database with notification_pending flag

[processQueue]
command:/usr/local/bin/python3 /usr/local/opnsense/scripts/OPNsense/DeviceMonitor/scan_network.py --process-queue
parameters:
type:script_output
message:Deliver queued Device Monitor notifications
description:Retries notifications whose delivery failed earlier
