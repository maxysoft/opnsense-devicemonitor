# Rotation for the Device Monitor log. /etc/newsyslog.conf includes
# /usr/local/etc/newsyslog.conf.d/[!.]*.conf, so the filename has to end in
# .conf. 1 MB per file, 7 generations, gzipped, created if missing.
#
# logfilename                [owner:group] mode count size  when  flags
/var/log/devicemonitor.log   root:wheel    640  7     1000  *     CZ
