# Rotation for the Device Monitor log.
#
# /etc/newsyslog.conf includes /usr/local/etc/newsyslog.conf.d/[!.]*.conf, so
# this file is picked up by the packaged path with no template needed. The
# filename has to end in .conf or the include glob skips it.
#
# 1 MB per file, 7 generations, gzipped, created if missing. That caps the log
# at a few MB even on the debug level, which writes one line per notification
# attempt.
#
# logfilename                [owner:group] mode count size  when  flags
/var/log/devicemonitor.log   root:wheel    640  7     1000  *     CZ
